[package]
name = "oc-collect"
description = "Small lib to collect data from OpenCode database"
version = "0.1.0"
authors = ["Toil"]
keywords = ["opencode", "stats", "collect"]
exclude = ["src/main.rs"]
readme = "README.md"
repository = "https://github.com/ilyhalight/oc-collect"
documentation = "https://docs.rs/oc-collect"
license = "MIT"
edition = "2024"

[lib]
bench = false

[dependencies]
anyhow = "1.0.103"
dirs = "6.0.0"
sqlx = { version = "0.9.0", features = ["sqlite", "runtime-tokio"] }
tokio = { version = "1.52.3", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"